grafana:
  enabled: true

  adminPassword: "ChangeThisPassword123!"

  service:
    type: ClusterIP

  persistence:
    enabled: false

prometheus:
  enabled: true

  prometheusSpec:
    retention: 3d

    resources:
      requests:
        cpu: 200m
        memory: 512Mi

      limits:
        cpu: 1000m
        memory: 1Gi

alertmanager:
  enabled: true

prometheusOperator:
  enabled: true

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true