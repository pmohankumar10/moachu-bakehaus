apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: moachu-hpa
  namespace: moachu

spec:

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: moachu-bakehaus

  minReplicas: 2
  maxReplicas: 5

  metrics:

    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70