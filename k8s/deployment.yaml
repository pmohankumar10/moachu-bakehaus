apiVersion: apps/v1
kind: Deployment

metadata:
  name: moachu-bakehaus
  namespace: moachu

spec:

  replicas: 2

  selector:
    matchLabels:
      app: moachu-bakehaus

  template:

    metadata:
      labels:
        app: moachu-bakehaus

    spec:

      containers:

        - name: moachu-bakehaus

          image: asia-south1-docker.pkg.dev/moachu-bakehaus-dev/moachu-images/moachu-bakehaus:v1

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20