apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: moachu-deployer
  namespace: moachu
rules:
  - apiGroups: ["", "apps", "autoscaling"]
    resources:
      - pods
      - services
      - deployments
      - replicasets
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: moachu-deployer-binding
  namespace: moachu
subjects:
  - kind: User
    name: moachu-github-deploy@moachu-bakehaus-dev.iam.gserviceaccount.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: moachu-deployer
  apiGroup: rbac.authorization.k8s.io